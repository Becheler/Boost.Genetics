name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install CMake
      run: sudo apt-get update && sudo apt-get install -y cmake

    - name: Configure CMake
      run: cmake -B build -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DBUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: cd build && ctest --output-on-failure