name: Benchmark

on:
  push:
    branches: [ main, feature/vcf-format-support ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential bcftools wget
    
    - name: Download test dataset
      run: |
        mkdir -p tests/data/reference
        cd tests/data/reference
        wget -q http://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000_genomes_project/release/20181203_biallelic_SNV/ALL.chr22.shapeit2_integrated_v1a.GRCh38.20181129.phased.vcf.gz
        gunzip -c ALL.chr22.shapeit2_integrated_v1a.GRCh38.20181129.phased.vcf.gz | head -n 10000 > chr22_subset.vcf
        rm ALL.chr22.shapeit2_integrated_v1a.GRCh38.20181129.phased.vcf.gz
    
    - name: Build benchmarks
      run: |
        cmake -B build -DBUILD_BENCHMARKS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build build --target benchmark_vcf_parallel benchmark_vcf_parsing -j$(nproc)
    
    - name: Run sequential benchmark
      id: seq_bench
      run: |
        cd build
        OUTPUT=$(./benchmark_vcf_parsing ../tests/data/reference/chr22_subset.vcf 2>&1)
        echo "$OUTPUT"
        RATE=$(echo "$OUTPUT" | grep "records/sec" | awk '{print $1}')
        echo "rate=$RATE" >> $GITHUB_OUTPUT
    
    - name: Run parallel benchmark (4 threads)
      id: par_bench
      run: |
        cd build
        OUTPUT=$(./benchmark_vcf_parallel ../tests/data/reference/chr22_subset.vcf 4 2>&1)
        echo "$OUTPUT"
        RATE=$(echo "$OUTPUT" | grep "Parallel.*rec/s" | awk '{print $4}')
        echo "rate=$RATE" >> $GITHUB_OUTPUT
    
    - name: Run bcftools baseline
      id: bcftools_bench
      run: |
        START=$(date +%s.%N)
        bcftools view -H tests/data/reference/chr22_subset.vcf > /dev/null
        END=$(date +%s.%N)
        DURATION=$(echo "$END - $START" | bc)
        RECORDS=$(bcftools view -H tests/data/reference/chr22_subset.vcf | wc -l)
        RATE=$(echo "scale=0; $RECORDS / $DURATION" | bc)
        echo "bcftools: $RATE rec/s"
        echo "rate=$RATE" >> $GITHUB_OUTPUT
    
    - name: Generate benchmark results
      run: |
        mkdir -p benchmark_results
        cat > benchmark_results/results.json << EOF
        {
          "schemaVersion": 1,
          "label": "VCF Parsing",
          "message": "${{ steps.par_bench.outputs.rate }} rec/s",
          "color": "brightgreen"
        }
        EOF
        
        cat > benchmark_results/report.md << EOF
        # Benchmark Results
        
        **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
        **Commit:** ${{ github.sha }}  
        **Runner:** ubuntu-latest ($(nproc) cores)
        
        ## Performance Metrics
        
        | Implementation | Records/sec | Speedup vs bcftools |
        |----------------|-------------|---------------------|
        | **Boost.Genetics Parallel (4 threads)** | **${{ steps.par_bench.outputs.rate }}** | **$(echo "scale=2; ${{ steps.par_bench.outputs.rate }} / ${{ steps.bcftools_bench.outputs.rate }}" | bc)x** |
        | Boost.Genetics Sequential | ${{ steps.seq_bench.outputs.rate }} | $(echo "scale=2; ${{ steps.seq_bench.outputs.rate }} / ${{ steps.bcftools_bench.outputs.rate }}" | bc)x |
        | bcftools (baseline) | ${{ steps.bcftools_bench.outputs.rate }} | 1.00x |
        
        ## Optimizations Implemented
        
        - ✅ Zero-copy string_view parsing
        - ✅ Arena memory allocator (bump-pointer)
        - ✅ Lazy INFO field parsing
        - ✅ Parallel chunk-based parsing
        - ✅ Cache-friendly data structures
        
        ## Dataset
        
        - **Source:** 1000 Genomes Project chr22
        - **Records:** ~6,272 variants
        - **Size:** ~10,000 lines
        EOF
        
        cat benchmark_results/report.md
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark_results/
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('benchmark_results/report.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
